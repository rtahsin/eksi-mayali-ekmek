  <script>
    // HTTPS Redirect zorlama (Instagram vs. için)
    if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
      location.replace('https:' + location.href.substring(location.protocol.length));
    }

    // Service Worker version management
    var serviceWorkerVersion = null;
    var APP_VERSION = '1.0.1'; // App version - UPDATED

    // Aggressive cache clear function
    function clearAllCaches() {
      if ('caches' in window) {
        caches.keys().then(function (names) {
          names.forEach(function (name) {
            console.log('[Cache] Clearing cache:', name);
            caches.delete(name);
          });
        });
      }
    }

    // Check for cache clear request (gizli sekme sorunu için)
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('clearCache') === 'true' || sessionStorage.getItem('forceClearCache')) {
      console.log('[App] Force clearing all caches...');
      clearAllCaches();
      sessionStorage.removeItem('forceClearCache');
      // URL'den parametreyi temizle
      if (urlParams.get('clearCache')) {
        window.history.replaceState({}, document.title, window.location.pathname);
      }
    }

    // Service Worker kaydı ve güncelleme
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        // Service worker'ı kaydet
        navigator.serviceWorker.register('/service-worker.js?v=' + APP_VERSION)
          .then(function (registration) {
            console.log('[App] Service Worker registered:', registration);

            // Sayfa yüklendiğinde güncellemeleri kontrol et
            registration.update();

            // Güncelleme kontrolü
            registration.addEventListener('updatefound', function () {
              const newWorker = registration.installing;
              console.log('[App] New Service Worker found, installing...');

              newWorker.addEventListener('statechange', function () {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  // Yeni SW yüklendi, cache'leri temizle ve aktif et
                  console.log('[App] New content available, clearing caches...');
                  clearAllCaches();
                  newWorker.postMessage({ type: 'SKIP_WAITING' });
                  // Kullanıcıya bildir (opsiyonel)
                  sessionStorage.setItem('newVersionAvailable', 'true');
                }
              });
            });
          })
          .catch(function (error) {
            console.error('[App] Service Worker registration failed:', error);
          });

        // Controller değiştiğinde sayfayı yenile
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (refreshing) return;
          refreshing = true;
          console.log('[App] New Service Worker activated, reloading...');
          window.location.reload();
        });
      });
    }

    // Debug: Cache durumunu konsola yaz
    if ('caches' in window && window.location.search.includes('debug=true')) {
      caches.keys().then(function (names) {
        console.log('[Debug] Active caches:', names);
      });
    }
  </script>

  <!-- KVKK ve Çerez Yönetimi için JS -->
  <script>
    // Çerez izin durumunu kontrol et
    function checkCookieConsent() {
      return localStorage.getItem('cookieConsent') === 'true';
    }

    // Çerez izin durumunu kaydet
    function saveCookieConsent(accepted) {
      localStorage.setItem('cookieConsent', accepted);

      // Çerez banner'ını gizle
      document.getElementById('cookie-banner').style.display = 'none';

      // Analitik izinlerini güncelle
      if (accepted) {
        // Google Analytics'i etkinleştir
        window['ga-disable-UA-XXXXXXXXX-X'] = false;
      } else {
        // Google Analytics'i devre dışı bırak
        window['ga-disable-UA-XXXXXXXXX-X'] = true;
      }
    }

    // Sayfa yüklendiğinde çerez izin kontrolü
    window.addEventListener('load', function () {
      if (!checkCookieConsent()) {
        // İzin alınmamışsa banner'ı göster
        document.getElementById('cookie-banner').style.display = 'block';
      }
    });
  </script>

  <style>
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #F5F3EF;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid #8B5A2B40;
      border-top: 5px solid #8B5A2B;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    /* Modern Çerez Banner'ı */
    #cookie-banner {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      max-width: 600px;
      width: 90%;
      background: linear-gradient(135deg, #ffffff 0%, #f8f9fa 100%);
      color: #333;
      padding: 24px 28px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12), 0 2px 8px rgba(0, 0, 0, 0.08);
      z-index: 9999;
      animation: slideUp 0.4s ease-out;
      border: 1px solid rgba(0, 0, 0, 0.06);
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateX(-50%) translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    }

    #cookie-banner p {
      margin: 0 0 16px 0;
      font-size: 14px;
      line-height: 1.6;
      color: #555;
    }

    #cookie-banner a {
      color: #D2691E;
      text-decoration: none;
      font-weight: 600;
      border-bottom: 1px solid rgba(210, 105, 30, 0.3);
      transition: all 0.2s ease;
    }

    #cookie-banner a:hover {
      color: #A0522D;
      border-bottom-color: #A0522D;
    }

    #cookie-banner button {
      background-color: #D2691E;
      border: none;
      color: white;
      padding: 12px 24px;
      text-align: center;
      text-decoration: none;
      display: inline-block;
      font-size: 14px;
      font-weight: 600;
      margin: 4px 6px;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.3s ease;
      box-shadow: 0 2px 8px rgba(210, 105, 30, 0.2);
    }

    #cookie-banner button:hover {
      background-color: #A0522D;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(210, 105, 30, 0.3);
    }

    #cookie-banner .reject {
      background-color: transparent;
      color: #666;
      border: 2px solid #ddd;
      box-shadow: none;
    }

    #cookie-banner .reject:hover {
      background-color: #f5f5f5;
      border-color: #999;
      color: #333;
      transform: translateY(-1px);
    }

    .loading-content {
      text-align: center;
    }

    .loading-text {
      font-family: Arial, sans-serif;
      margin-top: 20px;
      color: #8B5A2B;
    }

  <script>
    function openPrivacyPolicy() {
      // Flutter'a mesaj gönder
      if (window.flutter_inappwebview) {
        window.flutter_inappwebview.callHandler('navigate', '/privacy');
      } else {
        // Fallback: direkt navigation
        window.location.hash = '#/privacy';
        window.location.href = '/privacy';
      }
    }
  </script>

  <script>
    window.addEventListener('load', function (ev) {
      // Download main.dart.js
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: async function (engineInitializer) {
          // HTML renderer kullan - CanvasKit'ten 40-50% daha hızlı
          let appRunner = await engineInitializer.initializeEngine({
            renderer: "html",
            // Ek optimizasyonlar
            hostElement: document.querySelector("#flutter-target")
          });
          await appRunner.runApp();
        }
      });
    });
