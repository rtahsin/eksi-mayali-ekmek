  <!-- Configure and initialize Flutter -->
  <script>
    // BuildConfig must be set before calling loader
    window._flutter = window._flutter || {};
    window._flutter.buildConfig = window._flutter.buildConfig || {
      engineRevision: serviceWorkerVersion
    };

    // Wait for flutter.js to load, then initialize
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initFlutter);
    } else {
      initFlutter();
    }

    function initFlutter() {
      // Disable service worker - it causes timeout issues
      _flutter.loader.loadEntrypoint({
        serviceWorkerSettings: {
          serviceWorkerVersion: null, // Disable service worker
        },
        onEntrypointLoaded: async function (engineInitializer) {
          let appRunner = await engineInitializer.initializeEngine();
          await appRunner.runApp();
        }
      });
    }
  </script>

  <!-- KVKK ve Çerez Yönetimi için JS -->
  <script>
    // Çerez izin durumunu kontrol et
    function checkCookieConsent() {
      return localStorage.getItem('cookieConsent') === 'true';
    }

    // Çerez izin durumunu kaydet
    function saveCookieConsent(accepted) {
      localStorage.setItem('cookieConsent', accepted);

      // Çerez banner'ını gizle
      document.getElementById('cookie-banner').style.display = 'none';

      // Analitik izinlerini güncelle
      if (accepted) {
        // Google Analytics'i etkinleştir
        window['ga-disable-UA-XXXXXXXXX-X'] = false;
      } else {
        // Google Analytics'i devre dışı bırak
        window['ga-disable-UA-XXXXXXXXX-X'] = true;
      }
    }

    // Sayfa yüklendiğinde çerez izin kontrolü
    window.addEventListener('load', function () {
      if (!checkCookieConsent()) {
        // İzin alınmamışsa banner'ı göster
        document.getElementById('cookie-banner').style.display = 'block';
      }
    });
  </script>

  <style>
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #F5F3EF;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid #8B5A2B40;
      border-top: 5px solid #8B5A2B;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    /* Modern Çerez Banner'ı */
    #cookie-banner {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      max-width: 600px;
      width: 90%;
      background: linear-gradient(135deg, #ffffff 0%, #f8f9fa 100%);
      color: #333;
      padding: 24px 28px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12), 0 2px 8px rgba(0, 0, 0, 0.08);
      z-index: 9999;
      animation: slideUp 0.4s ease-out;
      border: 1px solid rgba(0, 0, 0, 0.06);
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateX(-50%) translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    }

    #cookie-banner p {
      margin: 0 0 16px 0;
      font-size: 14px;
      line-height: 1.6;
      color: #555;
    }

    #cookie-banner a {
      color: #D2691E;
      text-decoration: none;
      font-weight: 600;
      border-bottom: 1px solid rgba(210, 105, 30, 0.3);
      transition: all 0.2s ease;
    }

    #cookie-banner a:hover {
      color: #A0522D;
      border-bottom-color: #A0522D;
    }

    #cookie-banner button {
      background-color: #D2691E;
      border: none;
      color: white;
      padding: 12px 24px;
      text-align: center;
      text-decoration: none;
      display: inline-block;
      font-size: 14px;
      font-weight: 600;
      margin: 4px 6px;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.3s ease;
      box-shadow: 0 2px 8px rgba(210, 105, 30, 0.2);
    }

    #cookie-banner button:hover {
      background-color: #A0522D;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(210, 105, 30, 0.3);
    }

    #cookie-banner .reject {
      background-color: transparent;
      color: #666;
      border: 2px solid #ddd;
      box-shadow: none;
    }

    #cookie-banner .reject:hover {
      background-color: #f5f5f5;
      border-color: #999;
      color: #333;
      transform: translateY(-1px);
    }

    .loading-content {
      text-align: center;
    }

    .loading-text {
      font-family: Arial, sans-serif;
      margin-top: 20px;
      color: #8B5A2B;
    }

  <script>
    function openPrivacyPolicy() {
