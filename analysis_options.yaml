# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

# The following line activates a set of recommended lints for Flutter apps,
# packages, and plugins designed to encourage good coding practices.
include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # Kritik hatalar - warning olarak göster
    avoid_print: warning  # Print kullanımını uyar (Logger kullanılmalı)
    unawaited_futures: warning  # Await edilmeyen future'ları uyar
    deprecated_member_use: warning  # Deprecated API kullanımını uyar
    
    # Kod kalitesi - info olarak göster
    unused_import: info  # Kullanılmayan import'ları göster
    unused_local_variable: info  # Kullanılmayan değişkenleri göster
    unused_field: info  # Kullanılmayan field'ları göster
    unused_element: info  # Kullanılmayan element'leri göster
    
    # Stil tercihleri - ignore (çok fazla değişiklik gerektirir)
    prefer_const_constructors: ignore
    prefer_const_literals_to_create_immutables: ignore
    prefer_final_locals: ignore
    prefer_final_fields: ignore
    prefer_single_quotes: ignore
    sort_child_properties_last: ignore
    always_declare_return_types: ignore
    
    # Özel durumlar - ignore
    use_build_context_synchronously: ignore  # Flutter context kullanımı
    library_private_types_in_public_api: ignore  # Widget private types
    invalid_annotation_target: ignore  # Code generation için
    dead_null_aware_expression: ignore  # Null safety false positives
    unreachable_switch_default: ignore  # Enum switch'ler için
    unnecessary_cast: ignore  # Bazen tip güvenliği için gerekli
    unnecessary_null_comparison: ignore  # Explicit null check'ler
    avoid_types_as_parameter_names: ignore  # Nadiren gerekebilir
    omit_local_variable_types: ignore  # Explicit typing tercih edilebilir
    directives_ordering: ignore  # Import sıralaması esnek
    use_super_parameters: ignore  # Eski syntax desteklenebilir
  exclude:
    - build/**
    - lib/generated/**
    - lib/**/*.g.dart
    - lib/**/*.freezed.dart

linter:
  # The lint rules applied to this project can be customized in the
  # section below to disable rules from the `package:flutter_lints/flutter.yaml`
  # included above or to enable additional rules. A list of all available lints
  # and their documentation is published at https://dart.dev/lints.
  #
  # Instead of disabling a lint rule for the entire project in the
  # section below, it can also be suppressed for a single line of code
  # or a specific dart file by using the `// ignore: name_of_lint` and
  # `// ignore_for_file: name_of_lint` syntax on the line or in the file
  # producing the lint.
  rules:
    - avoid_empty_else
    - avoid_unused_constructor_parameters
    - await_only_futures
    - camel_case_types
    - cancel_subscriptions
    - empty_catches
    - file_names
    - library_names
    - library_prefixes
    - no_duplicate_case_values
    - null_closures
    - prefer_collection_literals
    - prefer_conditional_assignment
    - prefer_contains
    - prefer_is_empty
    - prefer_is_not_empty
    - slash_for_doc_comments
    - type_init_formals
    - unnecessary_const
    - unnecessary_new
    - unnecessary_this
    - unrelated_type_equality_checks
    - use_rethrow_when_possible
    - valid_regexps

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
