  <text x="400" y="468" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#6E5148" letter-spacing="2.5">
    CANLI EKŞİ MAYA · GÜNLÜK TAZE ÜRETİM
  </text>
</svg>
