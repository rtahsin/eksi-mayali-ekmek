name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Gizli dosya kontrolü
        run: |
          if git ls-files --error-unmatch .env .env.local >/dev/null 2>&1; then
            echo "HATA: .env / .env.local git'te izleniyor. 'git rm --cached' ile çıkarın."
            exit 1
          fi

      - name: Bağımlılıklar
        run: npm ci

      - name: Tip kontrolü
        run: npm run typecheck

      - name: Testler
        run: npm test --if-present

      - name: Derleme (Supabase env olmadan)
        run: npm run build
