name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Gizli dosya kontrolü
        run: |
          # .env.example dışındaki tüm .env varyantları (.env, .env.local, .env.production, alt klasörler) yasak
          tracked=$(git ls-files -- '.env' '.env.*' '**/.env' '**/.env.*' | grep -vE '(^|/)\.env\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "HATA: Şu ortam dosyaları git'te izleniyor ('git rm --cached' ile çıkarın):"
            echo "$tracked"
            exit 1
          fi

      - name: Repo hijyeni kontrolü
        run: |
          tracked=$(git ls-files local_llm_bridge playwright-report test-results .idea .firebase firebase-debug.log scripts/__pycache__)
          if [ -n "$tracked" ]; then
            echo "HATA: Şu dosyalar/dizinler git'te izlenmemelidir ('git rm -r --cached' ile çıkarın):"
            echo "$tracked"
            exit 1
          fi

      - name: Bağımlılıklar
        run: npm ci

      - name: Tip kontrolü
        run: npm run typecheck

      - name: Testler
        run: npm test --if-present

      - name: Derleme (Supabase env olmadan)
        run: npm run build
